plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.8.3"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenLocal()
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
	maven {
		url = "https://maven.blamejared.com"
		content {
			includeGroup "vazkii.patchouli"
			includeGroupByRegex "net\\.darkhax.*"
			includeGroupByRegex "com\\.blamejared.*"
			includeGroup "org.openzen.zencode"
			includeGroup "mezz.jei"
		}
	}
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = "https://maven.puffish.net" }
	maven { url = "https://maven.parchmentmc.org" }

	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
	maven { url = "https://maven.terraformersmc.com/"}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config}")
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
	modImplementation "curse.maven:jade-324717:7132429"

	modImplementation ("net.puffish:skillsmod:${puffish_skills}:fabric")
    modLocalRuntime "curse.maven:puffish-attributes-991341:7183587" // fabric only
	modLocalRuntime "curse.maven:default-skill-trees-1074229:5946580" // monojar
	// modLocalRuntime "curse.maven:puffish-attributes-991341:7183595" // neoforge only

	modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_version}")
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {transitive false}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishMods {
	file = remapJar.archiveFile
	modLoaders.add("fabric")
	changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
	version = "${mod_version}+${minecraft_version}-fabric"
	type = BETA
	displayName = "Fabric-${mod_version}+${minecraft_version}"

	curseforge {
		projectId = "${curseforge_project}"
		accessToken = System.getenv("CF_TOKEN")

		minecraftVersions.add(minecraft_version)
		javaVersions.add(JavaVersion.VERSION_21)

		clientRequired = true
		serverRequired = true

		// Dependencies
		requires "attributefix"
	}
}
